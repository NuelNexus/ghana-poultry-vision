    <circle cx="156" cy="816" r="4"/><circle cx="188" cy="816" r="4"/><circle cx="220" cy="816" r="4"/><circle cx="251" cy="816" r="4"/><circle cx="283" cy="816" r="4"/><circle cx="314" cy="816" r="4"/><circle cx="346" cy="816" r="4"/><circle cx="377" cy="816" r="4"/>
    <circle cx="156" cy="850" r="4"/><circle cx="188" cy="850" r="4"/><circle cx="220" cy="850" r="4"/><circle cx="251" cy="850" r="4"/><circle cx="283" cy="850" r="4"/><circle cx="314" cy="850" r="4"/><circle cx="346" cy="850" r="4"/><circle cx="377" cy="850" r="4"/>
    <circle cx="251" cy="886" r="4"/><circle cx="283" cy="886" r="4"/><circle cx="314" cy="886" r="4"/><circle cx="346" cy="886" r="4"/><circle cx="377" cy="886" r="4"/>
    <circle cx="283" cy="921" r="4"/><circle cx="314" cy="921" r="4"/><circle cx="346" cy="921" r="4"/><circle cx="377" cy="921" r="4"/>
